<body>
  <main id="lobby" class="screen">
    <h1>Ciudad</h1>
    <p id="config-note" class="note" hidden>La ciudad en línea todavía no está configurada. Puedes probarla en modo local: solo entre pestañas de este navegador.</p>
    <button id="local-mode" class="btn secondary" type="button" hidden>Jugar en modo local</button>

    <section class="card" aria-label="Tu mascota">
      <canvas id="preview" width="64" height="64" aria-hidden="true"></canvas>
      <div id="pet-fixed" hidden><strong id="pet-name"></strong></div>
      <form id="chooser" autocomplete="off">
        <label>Nombre <input id="name" maxlength="12" value="Mochi"></label>
        <label>Especie
          <select id="species"><option value="frog">Rana</option><option value="seal">Foca</option><option value="cat">Gato</option></select>
        </label>
        <label>Edad
          <select id="age"><option value="0">Bebé</option><option value="1">Niño</option><option value="2" selected>Adulto</option><option value="3">Mayor</option></select>
        </label>
        <label>Cabeza <select id="item-head"></select></label>
        <label>Cara <select id="item-face"></select></label>
        <label>Cuello <select id="item-neck"></select></label>
        <label>Espalda <select id="item-back"></select></label>
      </form>
    </section>

    <section class="card actions" id="actions">
      <button id="create" class="btn primary" type="button">Crear sala</button>
      <div class="join">
        <label for="code-input">Código</label>
        <input id="code-input" placeholder="FOCA-LUNA-42" maxlength="30" autocapitalize="characters" spellcheck="false" autocomplete="off">
        <button id="join" class="btn" type="button">Unirse</button>
      </div>
      <p id="error" class="error" role="alert"></p>
    </section>
  </main>

  <main id="town" class="screen town" hidden>
    <header class="bar">
      <span id="room-info" class="room-info"><span class="label">Código</span> <strong id="room-code"></strong>
        <button id="copy" class="btn small" type="button">Copiar código</button></span>
      <span id="visit-badge" class="badge" hidden>De visita desde su placa <span id="keepsakes" class="keepsakes"></span></span>
      <span id="visit-join" class="visit-join" hidden>
        <button id="v-create" class="btn small" type="button">Crear sala</button>
        <input id="v-code" class="small" placeholder="FOCA-LUNA-42" maxlength="30" autocapitalize="characters" spellcheck="false" autocomplete="off" aria-label="Código de sala">
        <button id="v-join" class="btn small" type="button">Unirse</button>
      </span>
      <span id="stars" class="stars" title="Estrellas" aria-label="Estrellas">⭐ <span id="stars-n">0</span></span>
      <button id="leave" class="btn small danger" type="button">Salir</button>
    </header>
    <div id="stage"><canvas id="view"></canvas>
      <div id="hud" class="hud">
        <div id="game-bar" class="game-bar" hidden>
          <span id="game-info" role="status"></span>
          <button id="game-exit" class="btn small danger" type="button">Salir del juego</button>
        </div>
        <div id="invite" class="invite" hidden>
          <span id="invite-text"></span>
          <button id="invite-join" class="btn big primary" type="button">Me sumo</button>
        </div>
        <div id="banner" class="banner" hidden></div>
        <div id="toasts" class="toasts" aria-live="polite"></div>
        <div class="game-actions">
          <button id="game-seek" class="btn big" type="button" hidden>¡Yo busco!</button>
          <button id="game-play" class="btn big primary" type="button" hidden></button>
        </div>
        <div id="results" class="results" hidden>
          <h2 id="results-title"></h2>
          <ul id="results-list"></ul>
          <p id="results-stars"></p>
          <button id="results-close" class="btn big primary" type="button">Seguir</button>
        </div>
      </div>
    </div>
    <p id="status" role="status"></p>
    <nav id="emotes" class="emotes" aria-label="Saludos"></nav>
  </main>

  <main id="gone" class="screen" hidden>
    <h1>Ciudad</h1>
    <p id="gone-text" class="note" role="status"></p>
    <a id="gone-lobby" class="btn" href="./" hidden>Ir a la ciudad</a>
  </main>

  <script type="module" src="src/main.js?v=e2733c38a9"></script>
</body>
