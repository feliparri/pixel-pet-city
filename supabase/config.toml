# Only the function settings are kept here; the rest of the project is configured in the Supabase dashboard.
# The single `trip` function authenticates each action by itself (device HMAC, or the web session token), so the gateway's JWT check is off.
# Deploy with: supabase functions deploy trip --project-ref cyzsawujfcfrorntugrm --no-verify-jwt   (or keep this file's setting)

[functions.trip]
verify_jwt = false
